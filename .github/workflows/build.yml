name: Compilacao e testes

on:
  push:
    branches: [main, modern-reader]
  pull_request:
    branches: [main, modern-reader]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ gcc python3 libexpat1-dev libfreetype-dev zlib1g-dev
      - name: Run sanitizer and regression tests
        run: sh scripts/verify-host.sh

  build-dslibris-nds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20240511
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Nintendo DS ROM
        run: make -j2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dslibris-modern-nds
          path: dslibris-modern.nds
          if-no-files-found: error
